# Use a new, free service. Never omit plan: Render's default is paid.
services:
  - type: web
    name: line-tra-commute-bot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: RESULT_LIMIT
        value: "3"
      - key: OUTBOUND_FROM
        value: 大湖
      - key: OUTBOUND_TO
        value: 新左營
      - key: RETURN_FROM
        value: 新左營
      - key: RETURN_TO
        value: 大湖
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: TDX_CLIENT_ID
        sync: false
      - key: TDX_CLIENT_SECRET
        sync: false
      - key: GROUP_CONTROLLER_USER_ID
        sync: false
